# Agent manifest: the vendor-neutral entry point.
#
# The operating doctrine is not welded to one vendor. `AGENTS.md` and
# `CLAUDE.md` at the root point to `.agents/START_HERE.md`, the start-here guide;
# this file lists the same entry points for OpenAI-family agents.
interface:
  display_name: "Agentic Repo Template"
  short_description: "Reference scaffold: the files, gates, and context that make agent-written code enterprise-grade."
  default_prompt: "Read .agents/START_HERE.md before writing. Before every push, run pnpm lint:anti-slop and pnpm lint:anti-slop:changed on the committed branch and clear every finding. Follow the gates; done means `pnpm verify` and `pnpm e2e` are green."

context:
  # Read these before writing any code.
  contract: ".agents/START_HERE.md"
  detail:
    - ".agents/project/AGENTIC_INFRASTRUCTURE.md"
    - ".agents/project/ARCHITECTURE.md"
    - ".agents/project/CONVENTIONS.md"
    - ".agents/project/DEFINITION_OF_DONE.md"
    - ".agents/project/QUALITY_GATES.md"
    - ".agents/project/PR_QUALITY.md"
    - ".agents/project/TECH_STACK.md"
    - ".agents/project/GLOSSARY.md"
  decisions: ".agents/decisions/"
  templates: ".agents/templates/"

commands:
  verify: "pnpm verify"
  anti_slop: "pnpm lint:anti-slop"
  anti_slop_advisory: "pnpm lint:anti-slop:advisory"
  anti_slop_changed: "pnpm lint:anti-slop:changed"
  e2e: "pnpm e2e"
  validate_pr_body: "node scripts/validate-pr-body.mjs"
