name: Set up pnpm store
description: Install dependencies with a shared pnpm store
inputs:
  install-command:
    description: Frozen dependency install command
    default: pnpm install --frozen-lockfile --ignore-scripts
  persistent-store:
    description: Persistent runner store directory from PNPM_STORE_DIR
    default: ''
  save-cache:
    description: Explicit manual-only cache save opt-in
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Locate pnpm store
      id: store
      shell: bash
      env:
        PERSISTENT_STORE: ${{ inputs.persistent-store }}
      run: |
        if [ -n "$PERSISTENT_STORE" ]; then
          pnpm config set store-dir "$PERSISTENT_STORE"
        fi
        echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm store
      id: restore
      if: inputs.persistent-store == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-
    - name: Install dependencies
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash -e -o pipefail -c "$INSTALL_COMMAND"
    - name: Save pnpm store
      if: inputs.persistent-store == '' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
    - name: Report pnpm store
      shell: bash
      env:
        CACHE_NAME: pnpm-store-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PERSISTENT: ${{ inputs.persistent-store != '' }}
      run: node scripts/ci-cache-report.mjs
