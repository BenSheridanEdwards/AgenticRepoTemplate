name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Branch contains main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The default pull_request checkout is a merge commit that always
      # contains main; check the PR head itself.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: sh scripts/require-up-to-date-main.sh

  quality:
    name: Type check · lint · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Install leaves the tree clean
        run: git diff --exit-code
      - run: pnpm check:context
      - run: pnpm check:suppressions
      - run: pnpm check:docs
      - run: pnpm check:adr
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm lint:policy
      - run: pnpm react-doctor

  fallow:
    name: Code intelligence (Fallow)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3.33.1
        with:
          version: "3.33.1"
          command: audit
          no-cache: true
          comment: true
          review-comments: true
      - name: Assert the Fallow CLI matches the package.json pin
        if: ${{ !cancelled() }}
        run: |
          expected="fallow $(node -p "require('./package.json').devDependencies.fallow")"
          actual="$(fallow --version | head -n 1)"
          echo "pinned: ${expected}"
          echo "ran:    ${actual}"
          test "${actual}" = "${expected}"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Architecture gate (forbidden imports)
        run: pnpm arch:gate
      - name: Role diagram matches the rules file
        run: pnpm arch:diagram && git diff --exit-code docs/architecture/roles.mmd
      - name: API reports match the public module entries
        run: pnpm api:check

  test:
    name: Unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: pnpm build
      - name: Bundle-size budget
        run: pnpm size
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 3

  e2e:
    name: End-to-end behaviour map
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high
      - name: License compliance
        run: pnpm license:check
      - name: Install Gitleaks CLI (MIT licensed)
        run: |
          directory="$(mktemp -d)"
          archive="${directory}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${archive}"
          # Pinned release asset SHA-256; verify before extracting or executing.
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${directory}" gitleaks
          echo "${directory}" >> "$GITHUB_PATH"
      - name: Secret scanner regression (clean and synthetic history)
        run: bash scripts/secret-scan-ci.test.sh
      - name: Secret scan (gitleaks, full history)
        run: bash scripts/secret-scan-ci.sh

  # The stable final result (ADR 0017). scripts/required-gates.mjs owns the
  # lane list and the decision. always() keeps this job running when a lane
  # fails or the run is cancelled: a skipped job reads as a pass in branch
  # protection, so `!cancelled()` here would let a cancelled run through.
  required-gates:
    name: Required gates
    if: always()
    needs: [up-to-date, quality, fallow, test, build, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Workflows and inventory match the contract
        run: node scripts/required-gates.mjs --check
      - name: Every required lane passed
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/required-gates.mjs --decide
