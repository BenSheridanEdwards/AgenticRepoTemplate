name: CI

on:
  # Pushes to main dispatch CI from main-tree.yml only when the merged tree
  # is new (ADR 0088).
  workflow_dispatch:
    inputs:
      save_pnpm_cache:
        description: Enable manual-only pnpm cache saves on main
        type: boolean
        default: false
  pull_request:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Branch contains main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The default pull_request checkout is a merge commit that always
      # contains main; check the PR head itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - run: sh scripts/require-up-to-date-main.sh

  quality:
    name: Type check · lint · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - name: Install leaves the tree clean
        run: git diff --exit-code
      - run: pnpm check:lockfile
      - run: pnpm check:context
      - run: pnpm check:suppressions
      - run: pnpm check:docs
      - run: pnpm check:adr
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm lint:policy
      - run: pnpm lint:anti-slop
      - run: pnpm react-doctor

  fallow:
    name: Code intelligence (Fallow)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.docs-only != 'true'
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - uses: fallow-rs/fallow@85fa32733e951df85966842f2bb6a3f2720a940c # v3.37.0
        if: steps.scope.outputs.docs-only != 'true'
        with:
          version: "3.33.1"
          command: audit
          no-cache: true
          comment: true
          review-comments: true
      - name: Assert the Fallow CLI matches the package.json pin
        if: ${{ !cancelled() && steps.scope.outputs.docs-only != 'true' }}
        run: |
          expected="fallow $(node -p "require('./package.json').devDependencies.fallow")"
          actual="$(fallow --version | head -n 1)"
          echo "pinned: ${expected}"
          echo "ran:    ${actual}"
          test "${actual}" = "${expected}"
      - name: Architecture gate (forbidden imports)
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm arch:gate
      - name: Role diagram matches the rules file
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm arch:diagram && git diff --exit-code docs/architecture/roles.mmd
      - name: API reports match the public module entries
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm api:check
      - name: Blast-radius evidence (ADR 0068)
        if: steps.scope.outputs.docs-only != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git -c core.quotePath=false diff --name-only HEAD^1..."$HEAD_SHA")"
          CHANGED="$changed" node scripts/blast-radius.mjs --collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.docs-only != 'true'
        continue-on-error: true
        with:
          name: blast-radius
          path: blast-radius.json
          if-no-files-found: warn
          retention-days: 7
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.docs-only != 'true'
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - run: pnpm test:coverage:app
        if: steps.scope.outputs.docs-only != 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scope.outputs.docs-only != 'true'
        continue-on-error: true
        with:
          name: coverage-final
          path: coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scope.outputs.docs-only != 'true'
        continue-on-error: true
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 3
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: Web-API contract
    runs-on: ubuntu-latest
    env:
      SCARF_ANALYTICS: 'false'
      PACT_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
          install-command: pnpm install --frozen-lockfile
      - run: pnpm test:contract
        env:
          PACT_DIR: ${{ runner.temp }}/pact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pact
          path: ${{ runner.temp }}/pact

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - run: pnpm test:integration

  tooling:
    name: Tooling tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
          install-command: pnpm install --frozen-lockfile
      - run: pnpm test:tooling --shard ${{ matrix.shard }}/3

  coverage:
    name: Changed-file coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.scope.outputs.docs-only != 'true'
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.scope.outputs.docs-only != 'true'
        with:
          name: coverage-final
          path: coverage/
      - name: Changed sources and slices have tests
        if: steps.scope.outputs.docs-only != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COVERAGE_FILE: coverage/coverage-final.json
        run: changed="$(git -c core.quotePath=false diff --name-only HEAD^1..."$HEAD_SHA")" && CHANGED="$changed" node scripts/confidence-label.mjs --coverage-gate
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.docs-only != 'true'
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - run: pnpm build
        if: steps.scope.outputs.docs-only != 'true'
      - name: Bundle-size budget
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm size
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.docs-only != 'true'
        continue-on-error: true
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 3
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end behaviour map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.docs-only != 'true'
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - name: Read Playwright version
        if: steps.scope.outputs.docs-only != 'true'
        id: playwright-version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = readFileSync('pnpm-lock.yaml', 'utf8');
          const version = lock.match(/^      '@playwright\/test':\n        specifier: .+\n        version: ([^\s(]+)/m)?.[1];
          if (!version) throw new Error('Missing resolved @playwright/test version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Cache Chromium
        if: steps.scope.outputs.docs-only != 'true'
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.scope.outputs.docs-only != 'true'
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [ "$BROWSER_CACHE_HIT" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Run console guard proof
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm e2e:console-guard
      - run: pnpm e2e
        if: steps.scope.outputs.docs-only != 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scope.outputs.docs-only != 'true'
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks reads every historical blob; keep a full clone to avoid lazy fetches.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          save-cache: ${{ inputs.save_pnpm_cache == true }}
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high
      - name: License compliance
        run: pnpm license:check
      - name: Install Gitleaks CLI (MIT licensed)
        run: |
          directory="$(mktemp -d)"
          archive="${directory}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${archive}"
          # Pinned release asset SHA-256; verify before extracting or executing.
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${directory}" gitleaks
          echo "${directory}" >> "$GITHUB_PATH"
      - name: Secret scanner regression (clean and synthetic history)
        run: bash scripts/secret-scan-ci.test.sh
      - name: Secret scan (gitleaks, full history)
        run: bash scripts/secret-scan-ci.sh

  # The stable final result (ADR 0017). scripts/required-gates.mjs owns the
  # lane list and the decision. always() keeps this job running when a lane
  # fails or the run is cancelled: a skipped job reads as a pass in branch
  # protection, so `!cancelled()` here would let a cancelled run through.
  required-gates:
    name: Required gates
    if: always()
    needs: [contract, up-to-date, quality, fallow, test, integration, tooling, coverage, build, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Workflows and inventory match the contract
        run: node scripts/required-gates.mjs --check
      - name: Every required lane passed
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/required-gates.mjs --decide
