name: CodeQL

# Static application security testing (SAST). Biome is style/correctness only —
# this is the gate that reasons about taint and vulnerability patterns in the
# source itself. Results surface in the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — catches advisories in code that hasn't changed

# CodeQL reads workflow-run metadata in private repositories.
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        name: Detect docs-only changes
        run: node scripts/docs-only-scope.mjs
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.scope.outputs.docs-only != 'true'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.scope.outputs.docs-only != 'true'
        with:
          category: '/language:javascript-typescript'
      - name: Docs-only summary
        if: steps.scope.outputs.docs-only == 'true'
        run: echo "Docs-only change; lane work skipped." >> "$GITHUB_STEP_SUMMARY"
