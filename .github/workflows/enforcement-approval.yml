# Enforcement sign-off gate, ADR 0022
# (.agents/decisions/0022-sign-off-only-loosening-enforcement-changes.md).
#
# pull_request_target runs the default branch's copy of this workflow and of
# scripts/enforcement-approval.mjs, so main's trusted rules judge every PR. The
# job reads the guarded files at the merge base and the PR head through the API,
# checks out main alone, and runs no PR code. It asks for a sign-off only when
# the PR loosens or rewrites what the gates enforce.
# Like every pull_request_target and issue_comment workflow, it takes effect once
# it lands on main.
name: Enforcement approval

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [edited] # ticking the approval box edits the gate's comment

permissions: {}

concurrency:
  group: enforcement-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    # Any edit of the comment this workflow wrote on a PR reaches the script,
    # whoever made it, so the script can refuse and clear a tick from anyone but
    # the approver.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      startsWith(github.event.comment.body, '<!-- enforcement-approval -->'))
    runs-on: ubuntu-latest
    # contents:read for main's script, the merge base, and the guarded files;
    # pull-requests:write for the head SHA, the files, and the gate's comment (a
    # PR's comments need the pull-requests scope, issues:write alone is
    # refused); statuses:write for the gate.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/enforcement-approval.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/enforcement-approval.mjs`);
            await run({ github, context, core });
