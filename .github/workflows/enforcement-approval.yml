# Enforcement approval gate, ADR 0007.
#
# pull_request_target runs the default branch's copy of this workflow and of
# scripts/enforcement-approval.mjs, so main's trusted rules judge every PR. The
# job reads the PR's changed files through the API and checks out main alone.
# Like every pull_request_target and issue_comment workflow, it takes effect once
# it lands on main.
name: Enforcement approval

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [edited] # ticking the approval box edits the sticky comment

permissions: {}

concurrency:
  group: enforcement-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    # Comment edits count when a person edits the comment this workflow wrote on
    # a PR. The script checks the editor's write access before it reads the box.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '<!-- enforcement-approval -->'))
    runs-on: ubuntu-latest
    # contents:read for main's script; pull-requests:write for the head SHA, the
    # files, and the sticky comment (a PR's comments need the pull-requests
    # scope, issues:write alone is refused); statuses:write for the gate.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/enforcement-approval.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/enforcement-approval.mjs`);
            await run({ github, context, core });
