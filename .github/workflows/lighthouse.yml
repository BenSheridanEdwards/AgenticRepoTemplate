name: Lighthouse

# Performance + accessibility budget against the production build. Audits run
# only when scripts/lighthouse-scope.mjs finds UI-relevant files in the pull
# request; otherwise the job still reports green under the same required check
# name. Accessibility and layout shift are hard floors; performance,
# best-practices, and the noisy timing metrics warn. Every assertion uses the
# median of three runs — see lighthouserc.json.
on: pull_request

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      # pull_request checks out the test-merge commit; HEAD^1 is the base tip,
      # so `git diff HEAD^1 HEAD` is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        name: Detect UI-relevant changes
        # The runner's preinstalled Node runs this dependency-free script, so
        # a skipped audit costs no install.
        run: node scripts/lighthouse-scope.mjs
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm build
      - name: Run Lighthouse
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm exec lhci autorun --config=tooling/lighthouse/lighthouserc.json
