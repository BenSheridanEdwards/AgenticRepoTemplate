name: StyleProof approve

# Adapted from the styleproof-init 7.7.0 approval caller, with the reusable
# workflow pinned to the v7.7.0 release commit instead of the moving @v7 tag.
# Thin wrapper that invokes the upstream reusable approval workflow — logic improvements
# ship via StyleProof releases. The reusable workflow flips the commit status when a
# write-access reviewer (not the PR author) ticks "Approve all changes".
#
# issue_comment workflows only run from the default branch, so this takes effect once
# merged to main. Until then the approval checkbox is inert.
on:
  issue_comment:
    types: [edited]

# statuses:write flips the gate; pull-requests:write resolves the PR head and
# author, edits the report comment, and posts refusal replies (issues:write does
# not cover pull request comments); contents:read verifies branch-published
# reports; actions:read verifies artifact-published reports.
permissions:
  statuses: write
  pull-requests: write
  contents: read
  actions: read

jobs:
  approve:
    uses: BenSheridanEdwards/StyleProof/.github/workflows/styleproof-approve-reusable.yml@0351899ca9ea11b992971eacfab0bcc3c59f7c5f # v7.7.0
    with:
      status-context: StyleProof
      allow-self-approval: false
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
