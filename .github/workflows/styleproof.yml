name: StyleProof

# CI-only computed-style gate: the PR head against the PR base commit.
#
# Both maps come from one install of the PR head. The head is captured in the
# checkout; the base is captured from a detached worktree under the ignored
# `.styleproof/` directory, built with the head's node_modules. Nothing is
# installed at the base commit, so a base whose tracked files an install would
# rewrite cannot dirty the capture. Maps are never uploaded to a map branch and
# the report is a workflow artifact. A reviewer signs off intentional changes on
# the report comment (styleproof-approve.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: styleproof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  styleproof:
    name: Computed-style visual gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # This job installs and runs PR code: never leave the token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Define runner-local map path
        run: echo "MAP_ROOT=${{ runner.temp }}/styleproof-maps" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Install leaves the tree clean
        run: |
          dirt="$(git status --porcelain)"
          if [ -n "$dirt" ]; then
            printf '%s\n' "$dirt"
            echo "::error::pnpm install modified the checkout; a dirty capture cannot bind to $HEAD_SHA"
            exit 1
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture the PR head
        run: pnpm exec styleproof-map --dir head --base-dir "$MAP_ROOT" --sha "$HEAD_SHA" --no-upload
      - id: base
        name: Capture the PR base
        run: |
          base_tree="$PWD/.styleproof/base"
          git worktree add --detach "$base_tree" "$BASE_SHA"
          status=0
          STYLEPROOF_APP_ROOT="$base_tree" pnpm exec styleproof-map \
            --dir base --base-dir "$MAP_ROOT" --sha "$BASE_SHA" --no-upload \
            --tolerate-surface-failures || status=$?
          git worktree remove --force "$base_tree"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Base capture exited $status; reporting a degraded baseline"
            rm -rf "$MAP_ROOT/base"
            mkdir -p "$MAP_ROOT/base"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Captures are bound to clean commits
        run: |
          for side in head base; do
            manifest="$MAP_ROOT/$side/styleproof-manifest.json"
            # A degraded base is bare by design; a missing head manifest is not.
            if [ "$side" = base ] && [ "${{ steps.base.outputs.failed }}" = true ]; then continue; fi
            node -e 'const m = require(process.argv[1]); console.log(`${process.argv[2]}: ${m.sha} dirty=${m.dirty}`); if (m.dirty !== false) process.exit(1);' "$manifest" "$side"
          done
          test -z "$(git status --porcelain)"
      # StyleProof v7.7.0
      - uses: BenSheridanEdwards/StyleProof@0351899ca9ea11b992971eacfab0bcc3c59f7c5f
        with:
          baseline-dir: ${{ runner.temp }}/styleproof-maps/base
          fresh-dir: ${{ runner.temp }}/styleproof-maps/head
          base-capture-failed: ${{ steps.base.outputs.failed }}
          report-storage: artifact
          require-approval: true
