name: StyleProof

# Gallery-only computed-style review (ADR 0063). Evidence faults fail the job;
# style changes produce advisory before/after reports. Route traversal stays off.
# Visual regression (ADR 0052) remains the blocking visual gate.
on:
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'apps/web/src/index.css'
      - 'apps/web/e2e/styleproof/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/package.json'
      - 'styleproof.config.ts'
      - 'playwright.styleproof.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/styleproof.yml'

concurrency:
  group: styleproof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  styleproof:
    name: StyleProof component gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # StyleProof installs its exact runtime into the base workspace too.
      pnpm_config_ignore_workspace_root_check: 'true'
      pnpm_config_minimum_release_age: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - id: maps
        name: Capture the gallery at base and head
        run: >-
          pnpm exec styleproof-ci --base "$BASE_SHA" --head "$HEAD_SHA"
          --spec-ref-if-missing "$HEAD_SHA"
          --base-dir "$RUNNER_TEMP/styleproof-maps" --no-store
      # StyleProof v8.0.1
      - uses: BenSheridanEdwards/StyleProof@8b702f76dfcf38d4438fe76c16daeb8dc61f315c
        with:
          baseline-dir: ${{ runner.temp }}/styleproof-maps/base
          fresh-dir: ${{ runner.temp }}/styleproof-maps/head
          base-capture-failed: ${{ steps.maps.outputs.base-capture-failed }}
          report-storage: artifact
          mode: advisory
