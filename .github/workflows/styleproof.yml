name: StyleProof

# Adapted from the styleproof-init 7.7.0 one-job template
# (workflow=single storage=artifact gate=review-gate). Hand-owned because the
# template pins Node 20, and this repo's pnpm 11 needs Node >= 22.13, and
# because the Action is pinned to a release commit, not the moving @v7 tag.
# To upgrade, regenerate into a scratch checkout and port the diff here.
#
# Base and head maps are captured in this job (base in a detached worktree),
# so nothing touches a map-store branch and the report is a workflow artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: styleproof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  styleproof:
    name: Computed-style visual gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job installs and runs PR code: never leave the token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - id: maps
        name: Capture StyleProof maps for base and head
        shell: bash
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" node node_modules/styleproof/bin/styleproof-ci.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --spec-ref-if-missing "${{ github.event.pull_request.head.sha }}" \
            --base-dir "${{ runner.temp }}/styleproof-maps" \
            --no-store
      # StyleProof v7.7.0
      - uses: BenSheridanEdwards/StyleProof@0351899ca9ea11b992971eacfab0bcc3c59f7c5f
        with:
          baseline-dir: ${{ runner.temp }}/styleproof-maps/base
          fresh-dir: ${{ runner.temp }}/styleproof-maps/head
          base-capture-failed: ${{ steps.maps.outputs.base-capture-failed }}
          report-storage: artifact
          require-approval: true
