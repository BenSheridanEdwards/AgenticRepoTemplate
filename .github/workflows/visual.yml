name: Visual regression

on: pull_request

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      # pull_request checks out the test-merge commit; HEAD^1 is the base tip,
      # so `git diff HEAD^1 HEAD` is exactly what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        name: Detect UI-relevant changes
        # The runner's preinstalled Node runs this dependency-free script, so
        # a skipped audit costs no install.
        run: node scripts/lighthouse-scope.mjs
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Read Playwright version
        id: playwright-version
        if: steps.changes.outputs.ui-changed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = readFileSync('pnpm-lock.yaml', 'utf8');
          const version = lock.match(/^      '@playwright\/test':\n        specifier: .+\n        version: ([^\s(]+)/m)?.[1];
          if (!version) throw new Error('Missing resolved @playwright/test version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Cache Chromium
        id: browser-cache
        if: steps.changes.outputs.ui-changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.changes.outputs.ui-changed == 'true'
        env:
          BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          if [ "$BROWSER_CACHE_HIT" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Compare approved screenshots
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm visual
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-differences
          path: |
            test-results/
            playwright-report/
          retention-days: 7
