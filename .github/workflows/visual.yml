name: Visual regression

on: pull_request

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      # pull_request checks out the test-merge commit; HEAD^1 is the base tip,
      # so `git diff HEAD^1 HEAD` is exactly what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        name: Detect UI-relevant changes
        # The runner's preinstalled Node runs this dependency-free script, so
        # a skipped audit costs no install.
        run: node scripts/lighthouse-scope.mjs
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.changes.outputs.ui-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Install Chromium
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm e2e:install
      - name: Compare approved screenshots
        if: steps.changes.outputs.ui-changed == 'true'
        run: pnpm visual
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-differences
          path: |
            test-results/
            playwright-report/
          retention-days: 7
