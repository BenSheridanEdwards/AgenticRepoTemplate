<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Turn repeated corrections into shared checks.</title><desc id="desc">People define the outcome. The repository carries the working agreement.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">01 / THE OPERATING MODEL</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Turn repeated corrections into shared checks.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">People define the outcome. The repository carries the working agreement.</text><rect x="48" y="220" width="260" height="200" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="72" y="268" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Intent</text><text x="72" y="320" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">What should</text><text x="72" y="360" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">happen?</text><path d="M316 320 L336 320" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><rect x="348" y="220" width="260" height="200" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="372" y="268" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Build</text><text x="372" y="320" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Follow the</text><text x="372" y="360" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">shared rules.</text><path d="M616 320 L636 320" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><rect x="648" y="220" width="260" height="200" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="672" y="268" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Check</text><text x="672" y="320" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Test behaviour</text><text x="672" y="360" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">and structure.</text><path d="M916 320 L936 320" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><rect x="948" y="220" width="260" height="200" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="972" y="268" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Review</text><text x="972" y="320" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Read the proof.</text><text x="972" y="360" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Make a decision.</text><rect x="48" y="456" width="1144" height="80" rx="12" fill="#e3eeec" stroke="#d9e3e4" stroke-width="2"/><text x="74" y="506" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Shared intent + executable standards + feedback for the next task</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Illustrated operating model · source links below explain each part.</text></svg>
