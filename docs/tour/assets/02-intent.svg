<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">A blank name has two observable consequences.</title><desc id="desc">The requirement and the test should describe the same promise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">02 / A PRECISE BEHAVIOUR</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">A blank name has two observable consequences.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">The requirement and the test should describe the same promise.</text><rect x="48" y="212" width="550" height="300" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="76" y="260" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">What the visitor sees</text><rect x="76" y="292" width="494" height="87" rx="10" fill="#fff4ee" stroke="#f0c6b8" stroke-width="2"/><text x="98" y="347" fill="#b34837" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="600">Enter a name</text><text x="76" y="426" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">The field is marked invalid.</text><text x="76" y="466" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">The greeting stays empty.</text><rect x="622" y="212" width="570" height="300" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="650" y="260" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">What the system does</text><text x="650" y="330" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">0</text><text x="710" y="327" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600">API requests</text><text x="650" y="403" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">The test records /trpc requests</text><text x="650" y="443" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">and checks that the list is empty.</text><text x="650" y="481" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="400">expect(apiCalls).toEqual([]);</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Source example · the second assertion checks a consequence the screen cannot show.</text></svg>
