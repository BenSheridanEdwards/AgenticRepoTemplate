<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">A warning can look right while the action is wrong.</title><desc id="desc">Illustrated fault: the warning appears, but an API request is also sent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">03 / MAKE THE ASSERTION USEFUL</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">A warning can look right while the action is wrong.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Illustrated fault: the warning appears, but an API request is also sent.</text><rect x="48" y="212" width="550" height="304" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="76" y="259" fill="#b34837" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CHECKS THE WARNING ONLY</text><text x="76" y="319" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">await expect(</text><text x="76" y="353" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">  page.getByRole(&#x27;alert&#x27;)</text><text x="76" y="387" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">  ).toHaveText(&#x27;Enter a name&#x27;);</text><text x="76" y="476" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Can miss the unwanted request.</text><rect x="622" y="212" width="570" height="304" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="650" y="259" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CHECKS BOTH PROMISES</text><text x="650" y="319" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">await expect(</text><text x="650" y="353" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">  page.getByRole(&#x27;alert&#x27;)</text><text x="650" y="387" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">  ).toHaveText(&#x27;Enter a name&#x27;);</text><text x="650" y="421" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400">expect(apiCalls).toEqual([]);</text><text x="650" y="476" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Checks the warning and requests.</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Source assertions, line-wrapped for reading · the fault scenario is illustrative, not a run result.</text></svg>
