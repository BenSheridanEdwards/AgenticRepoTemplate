<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Keep the business rule independent of its caller.</title><desc id="desc">Application code may call the domain. The reverse dependency is rejected.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">04 / AN EXECUTABLE ARCHITECTURE RULE</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Keep the business rule independent of its caller.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Application code may call the domain. The reverse dependency is rejected.</text><rect x="48" y="212" width="550" height="290" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="76" y="259" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ACCEPTED DIRECTION</text><text x="76" y="318" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Application</text><path d="M290 306 L365 306" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><text x="394" y="318" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Domain</text><text x="76" y="390" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">// application.ts</text><text x="76" y="424" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">import { formatGreeting }</text><text x="76" y="458" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">  from &#x27;./domain.ts&#x27;;</text><rect x="622" y="212" width="570" height="290" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="650" y="259" fill="#b34837" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">REJECTED DIRECTION</text><text x="650" y="318" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Domain</text><path d="M802 306 L871 306" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><text x="898" y="318" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Application</text><text x="650" y="390" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">// domain.ts</text><text x="650" y="424" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">import { greet }</text><text x="650" y="458" fill="#2363a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="400">  from &#x27;./application.ts&#x27;;</text><text x="48" y="548" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">The rule test checks both directions and names the broken dependency.</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Illustrated imports from the rule fixtures · the code excerpts are shortened for reading.</text></svg>
