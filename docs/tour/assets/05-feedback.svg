<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Give fast feedback locally; keep full regression in CI.</title><desc id="desc">Select affected tests by dependencies, including the code that uses a changed module.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">05 / RECOMMENDED FEEDBACK PLACEMENT</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Give fast feedback locally; keep full regression in CI.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Select affected tests by dependencies, including the code that uses a changed module.</text><rect x="48" y="222" width="348" height="220" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="73" y="271" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Commit</text><text x="73" y="332" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Fast source and</text><text x="73" y="372" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">structural checks</text><path d="M404 333 L426 333" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><rect x="438" y="222" width="348" height="220" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="463" y="271" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Push</text><text x="463" y="332" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Affected tests</text><text x="463" y="372" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">+ dependent features</text><path d="M794 333 L816 333" fill="none" stroke="#087c70" stroke-width="4" marker-end="url(#arrow)"/><rect x="828" y="222" width="348" height="220" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="853" y="271" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">CI</text><text x="853" y="332" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Full regression</text><text x="853" y="372" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">+ independent checks</text><rect x="48" y="476" width="1144" height="65" rx="10" fill="#e3eeec" stroke="#d9e3e4" stroke-width="2"/><text x="73" y="519" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Validate the selection. Use the full suite when the affected scope is uncertain.</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Recommended workflow · the linked hooks show the repository’s configured commands.</text></svg>
