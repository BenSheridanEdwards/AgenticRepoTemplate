<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Changing a rule is a separate decision.</title><desc id="desc">Guard common shortcuts and bind approval to the revision being reviewed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">06 / PROTECT THE STANDARDS</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Changing a rule is a separate decision.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Guard common shortcuts and bind approval to the revision being reviewed.</text><rect x="48" y="212" width="550" height="302" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="76" y="260" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Supported agent sessions</text><text x="76" y="315" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">The command guard recognises</text><text x="76" y="355" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">normal work and common shortcuts.</text><text x="76" y="400" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Normal command → continue</text><text x="76" y="459" fill="#b34837" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Hook shortcut → refuse</text><rect x="622" y="212" width="570" height="302" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="650" y="260" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">A guarded rule changes</text><text x="650" y="315" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">The authorised person reviews</text><text x="650" y="355" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">the reason and exact revision.</text><text x="650" y="400" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">Reviewed revision → sign-off</text><text x="650" y="459" fill="#b34837" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">New revision → fresh sign-off</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Illustrated decision rules · command-guard and approval tests are linked below.</text></svg>
