<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Use evidence to decide. Use outcomes to improve.</title><desc id="desc">Review the change in front of you, then evaluate improvements to the working method.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087c70" stroke-width="1.5"/></marker></defs><rect width="1240" height="650" rx="20" fill="#f5f8f7"/><text x="48" y="54" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">07 / HUMAN REVIEW AND MEASURED IMPROVEMENT</text><text x="48" y="108" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">Use evidence to decide. Use outcomes to improve.</text><text x="48" y="151" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Review the change in front of you, then evaluate improvements to the working method.</text><rect x="48" y="212" width="550" height="302" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="76" y="263" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Review this change</text><text x="76" y="327" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">What behaviour is promised?</text><text x="76" y="373" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">What do the assertions check?</text><text x="76" y="419" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Which revision was tested?</text><text x="76" y="465" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">What are the risks and rollback?</text><rect x="622" y="212" width="570" height="302" rx="16" fill="white" stroke="#d9e3e4" stroke-width="2"/><text x="650" y="263" fill="#087c70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Improve the next task</text><text x="650" y="327" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Was the new guidance used?</text><text x="650" y="373" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Did the task finish correctly?</text><text x="650" y="419" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Fewer retries or corrections?</text><text x="650" y="465" fill="#172c3c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Less time, including other tasks?</text><path d="M48 576 H1192" stroke="#d9e3e4"/><text x="48" y="615" fill="#526674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Review framework + proposed evaluation loop · a useful summary rests on meaningful evidence.</text></svg>
