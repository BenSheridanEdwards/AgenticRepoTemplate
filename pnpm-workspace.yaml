# pnpm settings (pnpm ≥ 11 reads them here, not from package.json).
# Native packages whose post-install build scripts we explicitly trust to run.
# Declaring them keeps installs reproducible and makes the trust decision a
# reviewable line rather than an interactive prompt.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  esbuild: true

minimumReleaseAgeExclude:
  - styleproof
  - uuid@11.1.1
  - js-yaml@3.15.0
  - brace-expansion@1.1.16
  - js-yaml@4.3.0
  - body-parser@1.20.6
  - fast-uri@3.1.4
  - brace-expansion@1.1.17
  - postcss@8.5.23
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - ip-address@10.2.2
  - ip-address@10.2.1
  - brace-expansion@1.1.18
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - nanoid@3.3.16

  - nanoid@3.3.18
  - postcss@8.5.18
  - browserslist@4.28.7
  - qs@6.15.4
  - qs@6.16.0
  - fast-uri@3.1.6
  - fast-uri@3.1.3

# Force-patch a transitive high-severity advisory the CI security gate caught:
# @lhci/cli (and its inquirer > external-editor chain) pulled tmp < 0.2.6, which
# has a path-traversal vulnerability (GHSA-ph9p-34f9-6g65). Pin the patched line
# across the whole tree.
overrides:
  body-parser@<1.20.6: ^1.20.6
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@<1.1.18: ^1.1.18
  browserslist@<=4.28.6: ^4.28.7

  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  fast-uri@>=3.1.2 <3.1.6: ^3.1.6
  ip-address@<=10.3.0: ^10.3.1
  ip-address@>=10.1.1 <=10.2.0: ^10.2.1
  ip-address@>=10.1.1 <=10.2.1: ^10.2.2
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.16: ^3.3.16
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  tmp: '>=0.2.6'
  uuid@<11.1.1: ^11.1.1

# No patched extract-zip release exists in npm yet. Keep this one advisory
# explicit and reviewable rather than pretending an unavailable 2.0.2 can be
# installed. Remove this exception as soon as a patched release is published.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
